services:
  postgres:
    image: postgres:16-alpine
    container_name: aoobee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aoobee
      POSTGRES_PASSWORD: aoobee123
      POSTGRES_DB: aoobee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
